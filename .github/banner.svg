<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">oe, the Opportunity Encoder command line</title>
  <desc id="desc">The Opportunity Encoder mark beside a terminal that installs oe with Homebrew and signs it in.</desc>
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9defdd" />
      <stop offset="1" stop-color="#22b69c" />
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#22b69c" stop-opacity="0.22" />
      <stop offset="1" stop-color="#22b69c" stop-opacity="0" />
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#9defdd" fill-opacity="0.07" />
    </pattern>
  </defs>

  <rect width="1280" height="440" rx="24" fill="#0b1a16" />
  <rect width="1280" height="440" rx="24" fill="url(#dots)" />
  <rect width="1280" height="440" rx="24" fill="url(#glow)" />

  <g transform="translate(96 108)">
    <rect width="112" height="112" rx="26" fill="url(#mark)" />
    <rect x="33" y="33" width="46" height="46" rx="14" fill="none" stroke="#0b1a16" stroke-width="9" />
    <circle cx="56" cy="56" r="9.5" fill="#0b1a16" />
  </g>

  <text x="96" y="296" fill="#e8fbf6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="72" font-weight="700">oe</text>
  <text x="96" y="340" fill="#9defdd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24">The Opportunity Encoder command line</text>

  <g transform="translate(616 72)">
    <rect width="568" height="296" rx="16" fill="#08120f" stroke="#22b69c" stroke-opacity="0.35" stroke-width="1.5" />
    <circle cx="28" cy="28" r="7" fill="#ff5f57" />
    <circle cx="52" cy="28" r="7" fill="#febc2e" />
    <circle cx="76" cy="28" r="7" fill="#28c840" />
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21">
      <text x="32" y="94"><tspan fill="#22b69c">$ </tspan><tspan fill="#e8fbf6">brew install eidra-umain/oe/oe</tspan></text>
      <text x="32" y="136"><tspan fill="#22b69c">$ </tspan><tspan fill="#e8fbf6">oe login</tspan></text>
      <text x="32" y="172" fill="#7fa89e">  Approve the sign-in in your browser</text>
      <text x="32" y="214"><tspan fill="#22b69c">$ </tspan><tspan fill="#e8fbf6">oe list-workflows -o json</tspan></text>
      <text x="32" y="256"><tspan fill="#22b69c">$ </tspan><tspan fill="#e8fbf6">oe --help</tspan><tspan fill="#9defdd"> ▍</tspan></text>
    </g>
  </g>
</svg>
